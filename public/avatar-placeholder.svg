<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="No profile photo">
  <!-- Shown wherever a villager has not uploaded a photo. Drawn in the app's
       own mist/muted greys so it reads as an empty slot rather than a brand
       mark — the PanchayatX logo used to stand in here, which made every
       photo-less account look like an official account. -->
  <rect width="100" height="100" fill="#f4f4f4"/>
  <circle cx="50" cy="39" r="15.5" fill="#c2c2bb"/>
  <path d="M50 60.5c-17.1 0-31 10.4-31 23.3V100h62V83.8c0-12.9-13.9-23.3-31-23.3z" fill="#c2c2bb"/>
</svg>
